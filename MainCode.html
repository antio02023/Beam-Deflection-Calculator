<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beam Deflection & Stress Calculator</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 25px; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            grid-column: span 2;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
        }
        .results h3 { margin-top: 0; color: #334155; }
        .result-item {
            font-size: 16px;
            margin: 10px 0;
        }
        .result-val {
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Beam Deflection & Stress Calculator</h1>
    <div class="form-grid">
        <div class="form-group">
            <label for="beamType">보의 종류 (Beam Type)</label>
            <select id="beamType">
                <option value="cantilever_end">외팔보 (Cantilever - End Load)</option>
                <option value="simply_center">단순보 (Simply Supported - Center Load)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="loadType">단면 형상 (Cross Section)</label>
            <select id="sectionType">
                <option value="rect">직사각형 (Rectangular)</option>
                <option value="circle">원형 (Circular)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="length">보의 길이 L (m)</label>
            <input type="number" id="length" value="2.0" step="0.1">
        </div>
        <div class="form-group">
            <label for="load">하중 P (N)</label>
            <input type="number" id="load" value="1000" step="10">
        </div>
        
        <div class="form-group">
            <label for="elastic">탄성계수 E (GPa)</label>
            <input type="number" id="elastic" value="200" step="1">
        </div>
        <div class="form-group" id="group_b">
            <label for="width">너비 b (mm)</label>
            <input type="number" id="width" value="50" step="1">
        </div>
        <div class="form-group" id="group_h">
            <label for="height">높이 h (mm)</label>
            <input type="number" id="height" value="100" step="1">
        </div>

        <button onclick="calculate()">계산하기 (Calculate)</button>
    </div>

    <div class="results" id="resultBox">
        <h3>결과 (Results)</h3>
        <div class="result-item">최대 처짐량: <span id="resDeflection" class="result-val">-</span> mm</div>
        <div class="result-item">최대 굽힘 응력: <span id="resStress" class="result-val">-</span> MPa</div>
    </div>
</div>

<script>
    // 단면 형상 변경 시 라벨 변경
    document.getElementById('sectionType').addEventListener('change', function() {
        const type = this.value;
        const labelB = document.querySelector('label[for="width"]');
        const labelH = document.querySelector('label[for="height"]');
        if(type === 'circle') {
            labelB.innerText = "직경 d (mm)";
            labelH.style.display = "none";
            document.getElementById('height').style.display = "none";
        } else {
            labelB.innerText = "너비 b (mm)";
            labelH.style.display = "block";
            document.getElementById('height').style.display = "block";
        }
    });

    function calculate() {
        const beamType = document.getElementById('beamType').value;
        const sectionType = document.getElementById('sectionType').value;
        const L = parseFloat(document.getElementById('length')); // m
        const rawL = parseFloat(document.getElementById('length').value);
        const P = parseFloat(document.getElementById('load').value); // N
        const E_gpa = parseFloat(document.getElementById('elastic').value); // GPa
        const E = E_gpa * 1e9; // Pa (N/m^2)
        
        let I = 0; // 단면2차모멘트 (m^4)
        let c = 0; // 중립축에서 최외곽까지 거리 (m)

        if(sectionType === 'rect') {
            const b = parseFloat(document.getElementById('width').value) * 1e-3; // m
            const h = parseFloat(document.getElementById('height').value) * 1e-3; // m
            I = (b * Math.pow(h, 3)) / 12;
            c = h / 2;
        } else {
            const d = parseFloat(document.getElementById('width').value) * 1e-3; // m
            I = (Math.PI * Math.pow(d, 4)) / 64;
            c = d / 2;
        }

        let maxDeflection = 0; // m
        let maxMoment = 0; // N·m

        if(beamType === 'cantilever_end') {
            // 외팔보 끝단 집중하중
            maxDeflection = (P * Math.pow(rawL, 3)) / (3 * E * I);
            maxMoment = P * rawL;
        } else {
            // 단순보 중앙 집중하중
            maxDeflection = (P * Math.pow(rawL, 3)) / (48 * E * I);
            maxMoment = (P * rawL) / 4;
        }

        const maxStress = (maxMoment * c) / I; // Pa
        const maxStressMPa = maxStress / 1e6; // MPa
        const maxDeflectionMm = maxDeflection * 1e3; // mm

        document.getElementById('resDeflection').innerText = maxDeflectionMm.toFixed(4);
        document.getElementById('resStress').innerText = maxStressMPa.toFixed(4);
    }
</script>

</body>
</html>
