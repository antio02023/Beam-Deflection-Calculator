<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beam Deflection & Stress Calculator</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 25px; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .full-width {
            grid-column: span 2;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }
        .control-row {
            display: flex;
            gap: 10px;
        }
        .control-row input {
            flex: 2;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        .control-row select {
            flex: 1;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background-color: white;
        }
        .main-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background-color: white;
        }
        button.calc-btn {
            grid-column: span 2;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.calc-btn:hover { background-color: #1d4ed8; }
        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
        }
        .results h3 { margin-top: 0; color: #334155; }
        .result-item {
            font-size: 16px;
            margin: 10px 0;
        }
        .result-val {
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Beam Deflection & Stress Calculator</h1>
    <div class="form-grid">
        <!-- 보의 종류 -->
        <div class="form-group">
            <label for="beamType">보의 종류 (Beam Type)</label>
            <select id="beamType" class="main-select">
                <option value="cantilever_end">외팔보 (Cantilever - End Load)</option>
                <option value="simply_center">단순보 (Simply Supported - Center Load)</option>
            </select>
        </div>
        
        <!-- 단면 형상 -->
        <div class="form-group">
            <label for="sectionType">단면 형상 (Cross Section)</label>
            <select id="sectionType" class="main-select">
                <option value="rect">직사각형 (Rectangular)</option>
                <option value="circle">원형 (Circular)</option>
            </select>
        </div>
        
        <!-- 보의 길이 L -->
        <div class="form-group">
            <label for="length">보의 길이 (L)</label>
            <div class="control-row">
                <input type="number" id="length" value="2.0" step="0.1">
                <select id="unitLength">
                    <option value="1">m</option>
                    <option value="0.01">cm</option>
                    <option value="0.001">mm</option>
                </select>
            </div>
        </div>

        <!-- 하중 P -->
        <div class="form-group">
            <label for="load">하중 (P)</label>
            <div class="control-row">
                <input type="number" id="load" value="1000" step="10">
                <select id="unitLoad">
                    <option value="1">N</option>
                    <option value="1000">kN</option>
                </select>
            </div>
        </div>
        
        <!-- 탄성계수 E -->
        <div class="form-group">
            <label for="elastic">탄성계수 (E)</label>
            <div class="control-row">
                <input type="number" id="elastic" value="200" step="1">
                <select id="unitElastic">
                    <option value="1e9">GPa</option>
                    <option value="1e6">MPa</option>
                </select>
            </div>
        </div>

        <!-- 너비 b 또는 직경 d -->
        <div class="form-group" id="group_b">
            <label for="width" id="labelWidth">너비 (b)</label>
            <div class="control-row">
                <input type="number" id="width" value="50" step="1">
                <select id="unitWidth">
                    <option value="0.001" selected>mm</option>
                    <option value="0.01">cm</option>
                    <option value="1">m</option>
                </select>
            </div>
        </div>

        <!-- 높이 h -->
        <div class="form-group" id="group_h">
            <label for="height">높이 (h)</label>
            <div class="control-row">
                <input type="number" id="height" value="100" step="1">
                <select id="unitHeight">
                    <option value="0.001" selected>mm</option>
                    <option value="0.01">cm</option>
                    <option value="1">m</option>
                </select>
            </div>
        </div>

        <button class="calc-btn" onclick="calculate()">계산하기 (Calculate)</button>
    </div>

    <div class="results" id="resultBox">
        <h3>결과 (Results)</h3>
        <div class="result-item">최대 처짐량: <span id="resDeflection" class="result-val">-</span> mm</div>
        <div class="result-item">최대 굽힘 응력: <span id="resStress" class="result-val">-</span> MPa</div>
    </div>
</div>

<script>
    // 단면 형상에 따른 라벨 변경 처리
    document.getElementById('sectionType').addEventListener('change', function() {
        const type = this.value;
        const labelWidth = document.getElementById('labelWidth');
        const groupH = document.getElementById('group_h');
        if(type === 'circle') {
            labelWidth.innerText = "직경 (d)";
            groupH.style.display = "none";
        } else {
            labelWidth.innerText = "너비 (b)";
            groupH.style.display = "block";
        }
    });

    function calculate() {
        const beamType = document.getElementById('beamType').value;
        const sectionType = document.getElementById('sectionType').value;

        // 각 변수별 입력값과 해당 선택 단위를 곱하여 표준 SI 단위(m, N, Pa)로 변환
        const L = parseFloat(document.getElementById('length').value) * parseFloat(document.getElementById('unitLength').value);
        const P = parseFloat(document.getElementById('load').value) * parseFloat(document.getElementById('unitLoad').value);
        const E = parseFloat(document.getElementById('elastic').value) * parseFloat(document.getElementById('unitElastic').value);
        
        let I = 0; // 단면2차모멘트 (m^4)
        let c = 0; // 중립축에서 최외곽 거리 (m)

        if(sectionType === 'rect') {
            const b = parseFloat(document.getElementById('width').value) * parseFloat(document.getElementById('unitWidth').value);
            const h = parseFloat(document.getElementById('height').value) * parseFloat(document.getElementById('unitHeight').value);
            I = (b * Math.pow(h, 3)) / 12;
            c = h / 2;
        } else {
            const d = parseFloat(document.getElementById('width').value) * parseFloat(document.getElementById('unitWidth').value);
            I = (Math.PI * Math.pow(d, 4)) / 64;
            c = d / 2;
        }

        let maxDeflection = 0; // m
        let maxMoment = 0;     // N·m

        if(beamType === 'cantilever_end') {
            maxDeflection = (P * Math.pow(L, 3)) / (3 * E * I);
            maxMoment = P * L;
        } else {
            maxDeflection = (P * Math.pow(L, 3)) / (48 * E * I);
            maxMoment = (P * L) / 4;
        }

        const maxStress = (maxMoment * c) / I; // Pa
        const maxStressMPa = maxStress / 1e6;   // MPa 변환
        const maxDeflectionMm = maxDeflection * 1e3; // mm 변환

        document.getElementById('resDeflection').innerText = maxDeflectionMm.toFixed(4);
        document.getElementById('resStress').innerText = maxStressMPa.toFixed(4);
    }
</script>

</body>
</html>
